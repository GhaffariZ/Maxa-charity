<!DOCTYPE html>
<html dir="rtl" lang="fa">

 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   ثبت نام پایه | Conca - قالب مدیریت بوت استرپ
  </title>
  <!-- favicon -->
  <link href="assets/img/logo/favicon.png" rel="shortcut icon" type="image/x-icon"/>
  <!-- global style sheet for all pages -->
  <link href="assets/css/bootstrap.css" id="bootstrap-css" rel="stylesheet" type="text/css"/>
  <link href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" rel="stylesheet" type="text/css"/>
  <link href="assets/css/conca.css" rel="stylesheet" type="text/css"/>
 </head>
 <body>
  <div class="auth-main">
   <div class="container-xxl">
	<div class="auth-wrapper auth-basic p-5 min-vh-100 d-flex align-items-center justify-content-center">
	 <div class="auth-card py-6">
	  <div class="card shadow-xl">
	   <div class="card-body py-9 px-6 px-sm-12">
		<div class="mb-7">
		 <div class="d-flex align-items-center justify-content-center mb-5">
		  <img alt="Conca" class="app-main-logo logo-black" src="assets/img/logo/logo.png" width="120"/>
		  <img alt="Conca" class="app-main-logo logo-white d-none" src="assets/img/logo/logo-white.png" width="120"/>
		 </div>
		 <div class="text-center">
		  <h4 class="mb-1 fw-semibold">
		   به Conca خوش آمدید
		  </h4>
		  <p>
		   اکنون وارد شوید تا سفری پر از هیجان را تجربه کنید.
		  </p>
		 </div>
		</div>
		<div class="row row-cols-sm-3 g-3">
		 <div class="col">
		  <a class="d-flex align-items-center justify-content-center auth-social-btn" href="#">
		   <img alt="facebook" src="assets/img/icons/social/google.svg"/>
		  </a>
		 </div>
		 <div class="col">
		  <a class="d-flex align-items-center justify-content-center auth-social-btn" href="#">
		   <img alt="facebook" src="assets/img/icons/social/facebook.svg"/>
		  </a>
		 </div>
		 <div class="col">
		  <a class="d-flex align-items-center justify-content-center auth-social-btn" href="#">
		   <img alt="facebook" src="assets/img/icons/social/apple.svg"/>
		  </a>
		 </div>
		</div>
		<div class="divider">
		 <div class="divider-text">
		  یا با ایمیل ثبت نام کنید
		 </div>
		</div>
		<div class="mb-3">
		 <label class="form-label" for="fullName">
		  نام کامل
		 </label>
		 <input class="form-control" id="fullName" type="text"/>
		</div>
		<div class="mb-3">
		 <label class="form-label" for="loginEmail">
		  ایمیل
		 </label>
		 <input class="form-control" id="loginEmail" placeholder="mali@example.com" type="email"/>
		</div>
		<div class="mb-3">
		 <label class="form-label" for="loginPassword">
		  رمز عبور
		 </label>
		 <div class="input-group mb-3">
		  <input class="form-control" id="loginPassword" placeholder="**********" type="password"/>
		  <span class="input-group-text password-toggle">
		   <span class="close-eye password-eye">
			<svg fill="none" height="10" viewbox="0 0 22 10" width="22" xmlns="http://www.w3.org/2000/svg">
			 <path d="M21 1C21 1 17 7 11 7C5 7 1 1 1 1" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
			 </path>
			 <path d="M14 6.5L15.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M19 4L21 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M1 6L3 4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M8 6.5L6.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			</svg>
		   </span>
		   <span class="open-eye password-eye d-none">
			<svg fill="none" height="16" viewbox="0 0 22 16" width="22" xmlns="http://www.w3.org/2000/svg">
			 <path d="M20.544 7.04498C20.848 7.4713 21 7.68447 21 8C21 8.31553 20.848 8.52869 20.544 8.95501C19.1779 10.8706 15.6892 15 11 15C6.31078 15 2.8221 10.8706 1.45604 8.95502C1.15201 8.5287 1 8.31553 1 8C1 7.68447 1.15201 7.47131 1.45604 7.04499C2.8221 5.12944 6.31078 1 11 1C15.6892 1 19.1779 5.12944 20.544 7.04498Z" stroke="currentColor" stroke-width="1.5">
			 </path>
			 <path d="M14 8C14 6.34315 12.6569 5 11 5C9.34315 5 8 6.34315 8 8C8 9.65685 9.34315 11 11 11C12.6569 11 14 9.65685 14 8Z" stroke="currentColor" stroke-width="1.5">
			 </path>
			</svg>
		   </span>
		  </span>
		 </div>
		</div>
		<div class="mb-3">
		 <label class="form-label" for="loginPasswordConfirm">
		  رمز عبور را تایید کنید
		 </label>
		 <div class="input-group mb-3">
		  <input class="form-control" id="loginPasswordConfirm" placeholder="**********" type="password"/>
		  <span class="input-group-text password-toggle">
		   <span class="close-eye password-eye">
			<svg fill="none" height="10" viewbox="0 0 22 10" width="22" xmlns="http://www.w3.org/2000/svg">
			 <path d="M21 1C21 1 17 7 11 7C5 7 1 1 1 1" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
			 </path>
			 <path d="M14 6.5L15.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M19 4L21 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M1 6L3 4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			 <path d="M8 6.5L6.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
			 </path>
			</svg>
		   </span>
		   <span class="open-eye password-eye d-none">
			<svg fill="none" height="16" viewbox="0 0 22 16" width="22" xmlns="http://www.w3.org/2000/svg">
			 <path d="M20.544 7.04498C20.848 7.4713 21 7.68447 21 8C21 8.31553 20.848 8.52869 20.544 8.95501C19.1779 10.8706 15.6892 15 11 15C6.31078 15 2.8221 10.8706 1.45604 8.95502C1.15201 8.5287 1 8.31553 1 8C1 7.68447 1.15201 7.47131 1.45604 7.04499C2.8221 5.12944 6.31078 1 11 1C15.6892 1 19.1779 5.12944 20.544 7.04498Z" stroke="currentColor" stroke-width="1.5">
			 </path>
			 <path d="M14 8C14 6.34315 12.6569 5 11 5C9.34315 5 8 6.34315 8 8C8 9.65685 9.34315 11 11 11C12.6569 11 14 9.65685 14 8Z" stroke="currentColor" stroke-width="1.5">
			 </path>
			</svg>
		   </span>
		  </span>
		 </div>
		</div>
		<div class="mb-5">
		 <div class="form-check form-check-inline">
		  <input class="form-check-input" id="loginAccept" type="checkbox" value="yes"/>
		  <label class="form-check-label" for="loginAccept">
		   موافقم
		   <a class="text-hover-underline" href="#">
			با شرایط حفظ حریم خصوصی
		   </a>
		  </label>
		 </div>
		</div>
		<div class="mb-3">
		 <div class="text-center">
		  <button class="btn btn-primary w-100" type="submit">
		   اکنون ثبت نام کنید
		  </button>
		 </div>
		</div>
		<p class="text-center">
		 از قبل حساب کاربری دارید؟
		 <a class="text-primary text-decoration-none text-hover-underline" href="#">
		  وارد شوید
		 </a>
		</p>
	   </div>
	  </div>
	 </div>
	</div>
   </div>
  </div>
  <!-- global js scripts for all pages -->
  <script src="assets/vendor/libs/jquery/jquery.js">
  </script>
  <script src="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js">
  </script>
  <script src="assets/js/bootstrap.js">
  </script>
  <!-- app js -->
  <script src="assets/js/conca-sidebar.js">
  </script>
  <script src="assets/js/conca.js">
  </script>
  <!-- page specific script -->
 </body>

</html>
