
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>benefactor userpanel</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script type="module" crossorigin src="/benefactor-dashboard/assets/index-BQnqynKr.js"></script>
      <link rel="stylesheet" crossorigin href="/benefactor-dashboard/assets/index-qfIQ8TsH.css">
    </head>

    <body>
      <div id="root"></div>

      <!-- ── Support ticket floating button ── -->
      <style>
        #maxa-ticket-fab{
          position:fixed;bottom:28px;left:28px;z-index:9999;
          display:flex;align-items:center;gap:10px;
          padding:13px 20px;border-radius:50px;
          background:linear-gradient(135deg,#4fb2b0,#007b7a);
          color:#fff;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:13px;font-weight:700;
          text-decoration:none;border:none;cursor:pointer;
          box-shadow:0 8px 24px -6px rgba(0,123,122,.55),0 3px 10px rgba(0,0,0,.15);
          transition:transform .2s,box-shadow .2s,filter .2s;
          letter-spacing:.3px;
          direction:rtl;
        }
        #maxa-ticket-fab:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.08);box-shadow:0 14px 32px -8px rgba(0,123,122,.65),0 4px 14px rgba(0,0,0,.18)}
        #maxa-ticket-fab:active{transform:scale(.97)}
        #maxa-ticket-fab svg{width:18px;height:18px;flex-shrink:0}
        #maxa-ticket-fab .fab-badge{
          position:absolute;top:-6px;right:-6px;
          width:18px;height:18px;border-radius:50%;
          background:#e0556b;color:#fff;font-size:10px;font-weight:800;
          display:none;align-items:center;justify-content:center;
          border:2px solid #fff;
          animation:fabPulse 1.8s ease-in-out infinite;
        }
        #maxa-ticket-fab.has-unread .fab-badge{display:flex}
        @keyframes fabPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,85,107,.6)}60%{box-shadow:0 0 0 6px rgba(224,85,107,0)}}
      </style>

      <a id="maxa-ticket-fab" href="/benefactor-dashboard/tickets.php" title="تیکت‌های پشتیبانی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        پشتیبانی
        <span class="fab-badge" id="fabBadge"></span>
      </a>

      <script>
      /* Check for unread ticket replies and badge the FAB */
      (function(){
        function getToken(){
          var keys=['access_token','token','jwt','maxa_token','auth_token','maxa_access_token'];
          for(var i=0;i<keys.length;i++){
            try{
              var v=localStorage.getItem(keys[i])||sessionStorage.getItem(keys[i]);
              if(v && v.split('.').length===3) return v;
            }catch(e){}
          }
          var objKeys=['auth','user','maxa_auth','maxa_user','benefactor_auth'];
          for(var j=0;j<objKeys.length;j++){
            try{
              var raw=localStorage.getItem(objKeys[j])||sessionStorage.getItem(objKeys[j]);
              if(!raw) continue;
              var obj=JSON.parse(raw);
              var t=obj&&(obj.token||obj.access_token||obj.jwt||(obj.data&&(obj.data.token||obj.data.access_token)));
              if(t && typeof t==='string' && t.split('.').length===3) return t;
            }catch(e){}
          }
          return null;
        }
        function checkUnread(){
          var token=getToken();
          if(!token) return;
          fetch('/api/tickets',{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}})
            .then(function(r){return r.ok?r.json():null;})
            .then(function(json){
              if(!json||!json.data) return;
              var tickets=json.data.tickets||[];
              var unread=tickets.filter(function(t){return t.has_unread;}).length;
              var fab=document.getElementById('maxa-ticket-fab');
              var badge=document.getElementById('fabBadge');
              if(!fab||!badge) return;
              if(unread>0){
                fab.classList.add('has-unread');
                badge.textContent=unread>9?'۹+':String(unread);
              } else {
                fab.classList.remove('has-unread');
              }
            })
            .catch(function(){});
        }
        /* Run after page loads to avoid blocking the React app */
        if(document.readyState==='complete'){
          setTimeout(checkUnread,2000);
        } else {
          window.addEventListener('load',function(){setTimeout(checkUnread,2000);});
        }
      })();
      </script>
    </body>
  </html>
